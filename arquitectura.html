<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>escales desde la -2 a la -1</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Cinzel:wght@400..900&family=Isometra&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">  
    <style>

body{
    
  font-family: "Work Sans", sans-serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style:normal;
}
    


h1{
    /*Cajas con color*/
    display: inline-block;
    width: 100px;
    height: 40px;
    background-color: blueviolet;      
    padding: 20px 20px 5px 20px;
    margin: 0 20px 0 0%;
    
}
.cuadros{
display:flex;
justify-content: center;
width:100%;
margin-top: 30px;
}
h2{
    /* Esto es solo como se colocan los elementos asi como se coloca en la página*/
  background-color: aquamarine;
  width: auto;
  margin-top: -2px;      
  margin-left: 50%;
  padding: 200px 50px 10px 100px;
  clip-path: polygon(100% 2%, 100% 100%, 0% 100%, 0% 36%);
}
h3{
    vertical-align: bottom;
    background-color: rgb(0, 243, 129);
    width: 90px;
    height: 520px;
    margin-right:0;
    margin-top: -200px;
    padding:10px;
}
h4{ /*pared*/
    background-color: rgb(104, 104, 183);
    width: auto;
    height: 100px;
    margin-top: -450px; 
    margin-left: 50%; 
     padding: 300px 40px 50px 60px; 

}

.barandilla p:nth-child(1){
    background-color: rgb(255, 0, 225);
    margin-left: 7%;
    margin-top:-300px;
    margin-right:50%;
    padding: 25px 0;

}
.barandilla p:nth-child(2){
    background-color: rgb(204, 255, 0);
    margin-left: 7%;
    margin-top:-20px;
    margin-right:50%;
    padding: 40px 0;

}
.barandilla p:nth-child(3){
    background-color: rgb(255, 0, 0);
    margin-left: 7%;
    margin-top:-16px;
    margin-right:50%;
    padding: 10px 0;

}
p{ /* Suelo*/

    background-color: rgb(199, 163, 211);
    margin:0px;
    padding: 50px;
}
    </style>
</head>

<body>
<HGroup class="cuadros">
    <h1>Cuadro</h1>
    <h1>Cuadro</h1>
    <h1>Cuadro</h1>
</HGroup>    
     <h2>Rectangulo</h2>
     <h3>Barandilla</h3>
      <h4>Pared del rectangulo</h4>

<hgroup class="barandilla">
    <p>Escalera 1</p>
    <p>Escalera 2</p>
    <p>Escalera 3</p>
</hgroup>

<footer>
    <p>suelo</p>
</footer>

</body>
</html>
